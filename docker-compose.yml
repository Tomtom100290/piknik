services:
  app:
    build: .
    container_name: piknik_app
    working_dir: /app
    volumes:
      - .:/app
      - cache:/app/var/cache
      - logs:/app/var/log
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://root:root@database:3306/piknik?serverVersion=8.0.32&charset=utf8mb4
      - APP_ENV=prod
    networks:
      - piknik

  nginx:
    image: nginx:alpine
    container_name: piknik_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - piknik

  database:
    image: mysql:8.0
    container_name: piknik_db
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: piknik
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - piknik

  mailer:
    image: axllent/mailpit
    container_name: piknik_mailer
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - piknik

volumes:
  cache:
  logs:
  db_data:


networks:
  piknik:
    driver: bridge
